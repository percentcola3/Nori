name: UI release compatibility probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash script/test_island_window.sh
