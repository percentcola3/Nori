name: Signed macOS release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Public tags finish independently; superseded branch/PR validation can stop.
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  SM_TEST_SKIP_SWIFT: '0'
  SM_TEST_BUILD: '0'

jobs:
  preflight:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public identity and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test -s signing/release.cer
          plutil -lint signing/release.plist
          plutil -lint signing/update.plist
          bash script/verify_release_version.sh "$RELEASE_TAG"
          bash script/release_appcast.sh check-version --source-info SimpleMole/Support/Info.plist
          if [[ -n "$RELEASE_TAG" ]]; then
            test -s "docs/releases/$RELEASE_TAG.md"
          fi
          bash script/check_previous_release.sh "$RELEASE_TAG" "$RUNNER_TEMP/previous-release"
      - uses: ./.github/actions/prepare-build
        id: dependencies
        with:
          architecture: native
          scope: preflight
      - name: Validate pipeline coverage and typecheck the whole app
        run: |
          python3 script/test_release_pipeline.py
          bash script/test.sh --group preflight
      - uses: ./.github/actions/save-build-cache
        with:
          path: ${{ steps.dependencies.outputs.module-path }}
          key: ${{ steps.dependencies.outputs.module-key }}
          cache-hit: ${{ steps.dependencies.outputs.module-hit }}

  regression:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [native-a, native-b, native-c, contracts]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-build
        id: dependencies
        with:
          architecture: native
          scope: ${{ matrix.group }}
      - name: Run every suite assigned to this regression group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: bash script/test.sh --group "$TEST_GROUP"
      - uses: ./.github/actions/save-build-cache
        with:
          path: ${{ steps.dependencies.outputs.module-path }}
          key: ${{ steps.dependencies.outputs.module-key }}
          cache-hit: ${{ steps.dependencies.outputs.module-hit }}

  build:
    needs: preflight
    # Private keys are never exposed on PRs or ordinary branch validation.
    # Tags/default-branch manual runs compile in parallel with regression;
    # assembly below still requires EVERY regression group to succeed.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    env:
      SM_BUILD_ARCHS: ${{ matrix.architecture }}
      SM_ALLOW_ADHOC: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-build
        id: dependencies
        with:
          architecture: ${{ matrix.architecture }}
          scope: build
      - name: Import the existing release identity
        timeout-minutes: 3
        env:
          SM_RELEASE_SIGNING_DIR: ${{ runner.temp }}/nori-release-signing
          FORGESWEEP_SIGNING_P12_BASE64: ${{ secrets.FORGESWEEP_SIGNING_P12_BASE64 }}
          FORGESWEEP_SIGNING_P12_PASSWORD: ${{ secrets.FORGESWEEP_SIGNING_P12_PASSWORD }}
        run: bash script/release_identity.sh import
      - name: Build and verify one signed architecture
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SM_RELEASE_SIGNING_DIR: ${{ runner.temp }}/nori-release-signing
          BUILD_ARCH: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          bash script/package_release.sh
          bash script/verify_release_version.sh "$RELEASE_TAG" "dist/$BUILD_ARCH/Nori.app/Contents/Info.plist"
          {
            printf 'Source commit: %s\nSource ref: %s\n' "$GITHUB_SHA" "$GITHUB_REF"
            bash script/verify_release_version.sh "$RELEASE_TAG"
            printf 'Update public Ed25519 key: %s\n' "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' SimpleMole/Support/Info.plist)"
            bash script/verify_release.sh "dist/$BUILD_ARCH/Nori.app"
          } > "dist/RELEASE-IDENTITY-$BUILD_ARCH.txt"
          /usr/bin/ditto -c -k --keepParent "dist/$BUILD_ARCH/Nori.app" "dist/Nori-$BUILD_ARCH.app.zip"
          cd dist
          shasum -a 256 "Nori-$BUILD_ARCH.dmg" "Nori-$BUILD_ARCH.app.zip" \
            "RELEASE-IDENTITY-$BUILD_ARCH.txt" > "SHA256SUMS-$BUILD_ARCH"
      - name: Remove the temporary signing keychain
        if: always()
        timeout-minutes: 2
        env:
          SM_RELEASE_SIGNING_DIR: ${{ runner.temp }}/nori-release-signing
        run: bash script/release_identity.sh cleanup
      - uses: ./.github/actions/save-build-cache
        with:
          path: ${{ steps.dependencies.outputs.module-path }}
          key: ${{ steps.dependencies.outputs.module-key }}
          cache-hit: ${{ steps.dependencies.outputs.module-hit }}
      - name: Upload this run's verified architecture inputs
        uses: actions/upload-artifact@v4
        with:
          name: Nori-package-${{ matrix.architecture }}
          path: |
            dist/Nori-${{ matrix.architecture }}.dmg
            dist/Nori-${{ matrix.architecture }}.app.zip
            dist/RELEASE-IDENTITY-${{ matrix.architecture }}.txt
            dist/SHA256SUMS-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [preflight, regression, build]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-build
        id: dependencies
        with:
          architecture: native
          scope: assemble
      - name: Download only architecture artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: Nori-package-*
          merge-multiple: true
          path: .build/release-inputs
      - name: Verify source provenance and reuse both signed builds
        run: bash script/assemble_release.sh .build/release-inputs "$GITHUB_SHA" "$GITHUB_REF"
      - name: Recheck continuity with the current public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash script/check_previous_release.sh "$RELEASE_TAG" "$RUNNER_TEMP/previous-release"
      - name: Sign and verify architecture-specific update feeds
        env:
          NORI_SPARKLE_PRIVATE_KEY: ${{ secrets.NORI_SPARKLE_PRIVATE_KEY }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ -z "$NORI_SPARKLE_PRIVATE_KEY" ]]; then
            echo '::error::Configure the backed-up Sparkle Ed25519 key.'
            exit 1
          fi
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/nori-update-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$NORI_SPARKLE_PRIVATE_KEY" > "$key_file"
          unset NORI_SPARKLE_PRIVATE_KEY
          sparkle_dir=$(/usr/bin/python3 script/fetch_sparkle.py)
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' SimpleMole/Support/Info.plist)
          tag="${RELEASE_TAG:-v$version}"
          options=(--tag "$tag" --source-info SimpleMole/Support/Info.plist \
            --dist-dir dist --repository "$GH_REPO" --sign-tool "$sparkle_dir/bin/sign_update" \
            --private-key-file "$key_file")
          if [[ -f "docs/releases/$tag.md" ]]; then
            options+=(--notes-file "docs/releases/$tag.md")
          fi
          # Rebuilding an existing version is allowed only for manual
          # validation, which cannot create a public Release.
          if [[ -n "$RELEASE_TAG" && -f "$RUNNER_TEMP/previous-release/RELEASE-IDENTITY.txt" ]]; then
            options+=(--previous-identity "$RUNNER_TEMP/previous-release/RELEASE-IDENTITY.txt")
          fi
          bash script/release_appcast.sh generate "${options[@]}"
          cd dist
          shasum -a 256 Nori-arm64.dmg Nori-x86_64.dmg appcast-arm64.xml appcast-x86_64.xml RELEASE-IDENTITY.txt > SHA256SUMS
      - uses: ./.github/actions/save-build-cache
        with:
          path: ${{ steps.dependencies.outputs.module-path }}
          key: ${{ steps.dependencies.outputs.module-key }}
          cache-hit: ${{ steps.dependencies.outputs.module-hit }}
      - name: Upload the final distribution allowlist
        uses: actions/upload-artifact@v4
        with:
          name: Nori-macos
          path: |
            dist/Nori-arm64.dmg
            dist/Nori-x86_64.dmg
            dist/appcast-arm64.xml
            dist/appcast-x86_64.xml
            dist/SHA256SUMS
            dist/RELEASE-IDENTITY.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release-source

      - name: Download verified distribution files
        uses: actions/download-artifact@v4
        with:
          name: Nori-macos
          path: release-assets

      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          notes="$GITHUB_WORKSPACE/release-source/docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          # Do not silently replace assets on an existing or published release.
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "Nori $RELEASE_TAG" \
            --notes-file "$notes" \
            Nori-arm64.dmg Nori-x86_64.dmg appcast-arm64.xml appcast-x86_64.xml RELEASE-IDENTITY.txt SHA256SUMS
