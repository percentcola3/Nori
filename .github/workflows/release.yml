name: Signed macOS release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build jobs cannot publish or modify repository content.
permissions:
  contents: read

concurrency:
  # A stuck, failed attempt must not block a repaired unpublished tag's source.
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Manual runs are limited to the default branch. Tags and that branch must
    # contain reviewed code: this workflow intentionally never runs on PRs.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Use a complete stable Xcode toolchain, including its Swift macro plugins.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      SM_BUILD_ARCHS: arm64 x86_64
      SM_ALLOW_ADHOC: '0'
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate toolchain and public identity
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test -s signing/release.cer
          plutil -lint signing/release.plist
          plutil -lint signing/update.plist
          bash script/verify_release_version.sh "$RELEASE_TAG"
          bash script/release_appcast.sh check-version --source-info SimpleMole/Support/Info.plist
          if [[ -n "$RELEASE_TAG" ]]; then
            test -s "docs/releases/$RELEASE_TAG.md"
          fi

      - name: Run regression checks
        env:
          SM_TEST_SKIP_SWIFT: '0'
          SM_TEST_BUILD: '0'
        run: |
          bash script/test.sh
          bash script/test_release_version.sh
          bash script/test_install_update.sh
          bash script/test_app_updates.sh
          sparkle_dir=$(/usr/bin/python3 script/fetch_sparkle.py)
          NORI_TEST_SPARKLE_SIGN_TOOL="$sparkle_dir/bin/sign_update" bash script/test_release_appcast.sh

      - name: Check continuity with the previous public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' \
              > "$RUNNER_TEMP/nori-previous-tag" 2> "$RUNNER_TEMP/nori-previous-error"; then
            previous_tag=$(cat "$RUNNER_TEMP/nori-previous-tag")
          else
            # Only an empty stable-release list qualifies as a bootstrap. An
            # API/network error must not bypass an existing release's checks.
            previous_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
              --json tagName --jq '.[0].tagName // empty')
            if [[ -n "$previous_tag" ]]; then
              echo '::error::Unable to inspect the latest stable Release; refusing to skip continuity checks.'
              exit 1
            fi
          fi
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" --pattern RELEASE-IDENTITY.txt --dir "$RUNNER_TEMP/previous-release"
            bash script/verify_release_continuity.sh "$RUNNER_TEMP/previous-release/RELEASE-IDENTITY.txt"
            bash script/release_appcast.sh check-version \
              --source-info SimpleMole/Support/Info.plist \
              --previous-identity "$RUNNER_TEMP/previous-release/RELEASE-IDENTITY.txt"
          else
            echo 'Initial public release: no previous published signing identity.'
          fi

      - name: Import the existing release identity
        timeout-minutes: 3
        # Secrets exist only in this step's environment, never as arguments,
        # workflow outputs, artifact paths, or a generated certificate.
        env:
          SM_RELEASE_SIGNING_DIR: ${{ runner.temp }}/nori-release-signing
          FORGESWEEP_SIGNING_P12_BASE64: ${{ secrets.FORGESWEEP_SIGNING_P12_BASE64 }}
          FORGESWEEP_SIGNING_P12_PASSWORD: ${{ secrets.FORGESWEEP_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FORGESWEEP_SIGNING_P12_BASE64" || -z "$FORGESWEEP_SIGNING_P12_PASSWORD" ]]; then
            echo '::error::Configure FORGESWEEP_SIGNING_P12_BASE64 and FORGESWEEP_SIGNING_P12_PASSWORD in repository Actions secrets.'
            exit 1
          fi
          bash script/release_identity.sh import

      - name: Build and verify both distribution packages
        env:
          SM_RELEASE_SIGNING_DIR: ${{ runner.temp }}/nori-release-signing
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          bash script/package_release.sh
          bash script/verify_release.sh dist/arm64/Nori.app
          bash script/verify_release.sh dist/x86_64/Nori.app
          bash script/verify_release_version.sh "$RELEASE_TAG" dist/arm64/Nori.app/Contents/Info.plist
          bash script/verify_release_version.sh "$RELEASE_TAG" dist/x86_64/Nori.app/Contents/Info.plist
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Source ref: %s\n' "$GITHUB_REF"
            bash script/verify_release_version.sh "$RELEASE_TAG"
            printf 'Update public Ed25519 key: %s\n' "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' SimpleMole/Support/Info.plist)"
            bash script/verify_release.sh dist/arm64/Nori.app
            bash script/verify_release.sh dist/x86_64/Nori.app
          } > dist/RELEASE-IDENTITY.txt

      - name: Sign and verify architecture-specific update feeds
        # The Ed25519 private key is separate from the fixed App signing identity.
        # It is only available to this step and never becomes an artifact/output.
        env:
          NORI_SPARKLE_PRIVATE_KEY: ${{ secrets.NORI_SPARKLE_PRIVATE_KEY }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ -z "$NORI_SPARKLE_PRIVATE_KEY" ]]; then
            echo '::error::Configure NORI_SPARKLE_PRIVATE_KEY with the backed-up Sparkle Ed25519 key.'
            exit 1
          fi
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/nori-update-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$NORI_SPARKLE_PRIVATE_KEY" > "$key_file"
          unset NORI_SPARKLE_PRIVATE_KEY
          sparkle_dir=$(/usr/bin/python3 script/fetch_sparkle.py)
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' SimpleMole/Support/Info.plist)
          tag="${RELEASE_TAG:-v$version}"
          options=(--tag "$tag" --source-info SimpleMole/Support/Info.plist \
            --dist-dir dist --repository "$GH_REPO" --sign-tool "$sparkle_dir/bin/sign_update" \
            --private-key-file "$key_file")
          if [[ -f "docs/releases/$tag.md" ]]; then
            options+=(--notes-file "docs/releases/$tag.md")
          fi
          if [[ -f "$RUNNER_TEMP/previous-release/RELEASE-IDENTITY.txt" ]]; then
            options+=(--previous-identity "$RUNNER_TEMP/previous-release/RELEASE-IDENTITY.txt")
          fi
          bash script/release_appcast.sh generate "${options[@]}"
          cd dist
          shasum -a 256 Nori-arm64.dmg Nori-x86_64.dmg appcast-arm64.xml appcast-x86_64.xml RELEASE-IDENTITY.txt > SHA256SUMS

      - name: Remove the temporary signing keychain
        if: always()
        timeout-minutes: 2
        env:
          SM_RELEASE_SIGNING_DIR: ${{ runner.temp }}/nori-release-signing
        run: bash script/release_identity.sh cleanup

      - name: Upload distribution files
        uses: actions/upload-artifact@v4
        with:
          name: Nori-macos
          # Explicit allowlist: never upload the workspace, runner temp, p12,
          # private keys, keychains, or secret backup files.
          path: |
            dist/Nori-arm64.dmg
            dist/Nori-x86_64.dmg
            dist/appcast-arm64.xml
            dist/appcast-x86_64.xml
            dist/SHA256SUMS
            dist/RELEASE-IDENTITY.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: release-source

      - name: Download verified distribution files
        uses: actions/download-artifact@v4
        with:
          name: Nori-macos
          path: release-assets

      - name: Create a draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          notes="$GITHUB_WORKSPACE/release-source/docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          # Do not silently replace assets on an existing or published release.
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "Nori $RELEASE_TAG" \
            --notes-file "$notes" \
            Nori-arm64.dmg Nori-x86_64.dmg appcast-arm64.xml appcast-x86_64.xml RELEASE-IDENTITY.txt SHA256SUMS
