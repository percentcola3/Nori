<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="nori-apps-title">
<title id="nori-apps-title">Nori · 呼吸</title>
<style>
:root {color-scheme:light dark; background:transparent}
.jelly {transform-origin:132px 218px}
.eyelid {transform-origin:0 0}
.gaze {transform-origin:145px 110px}
@keyframes blink {0%,43%,49%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
@keyframes work {0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.055,.945)}55%{transform:translateY(-3px) scale(.96,1.04)}80%{transform:translateY(0) scale(1.025,.975)}}
@keyframes workGaze {0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes celebrate {0%,100%{transform:translateY(0) scale(1)}15%{transform:scale(1.12,.88)}38%{transform:translateY(-3px) scale(.965,1.035)}65%{transform:scale(1.07,.93)}82%{transform:scale(.98,1.02)}}

.chase{transform-box:fill-box;transform-origin:center}
.rise{transform-box:fill-box;transform-origin:50% 100%}
@keyframes nori-orbit {to{transform:rotate(360deg)}}
.orbit-spin{animation:nori-orbit 1.8s linear infinite;transform-origin:0 0}
@keyframes nori-lookBubble {0%,100%{transform:translate(5px,-4px)}50%{transform:translate(7px,-5px)}}
@keyframes nori-sway {0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes nori-content {0%,100%{transform:scaleY(.45)}}
@keyframes nori-note {0%{opacity:0;transform:translate(0,8px)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-46px)}}
@keyframes breathe {0%,100%{transform:scale(1)}50%{transform:scale(1.012,.988)}}
@keyframes nori-sleepBreath {0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes nori-closed {0%,100%{transform:scaleY(.1)}}
@keyframes nori-z {0%{opacity:0;transform:translate(0,6px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(18px,-40px) scale(1.1)}}
@keyframes nori-bubbleRise {0%{transform:translate(0,0) scale(.3);opacity:0}12%{opacity:1}78%{transform:translate(18px,-120px) scale(1);opacity:1}86%{transform:translate(20px,-128px) scale(1.25);opacity:0}100%{transform:translate(20px,-128px) scale(1.25);opacity:0}}
@keyframes nori-bubbleGaze {0%,100%{transform:translate(-6px,6px)}78%{transform:translate(2px,-6px)}86%{transform:translate(2px,-6px)}}
@keyframes nori-happy {0%,100%{transform:scaleY(1)}20%,80%{transform:scaleY(.42)}}
@keyframes nori-badgePop {0%,8%{transform:scale(0) rotate(-20deg)}22%{transform:scale(1.18) rotate(6deg)}32%{transform:scale(.94) rotate(-3deg)}42%,100%{transform:scale(1) rotate(0deg)}}
@keyframes nori-sad {0%,100%{transform:translateY(0) scale(1,1)}30%,90%{transform:translateY(3px) scale(1.025,.965)}}
@keyframes nori-lookBadge {0%,14%{transform:translate(0,0)}30%,100%{transform:translate(6px,5px)}}
@keyframes nori-sip {0%,22%,100%{transform:translate(0,0) rotate(0deg)}46%,62%{transform:translate(-14px,-10px) rotate(-8deg)}}
@keyframes nori-sipBody {0%,22%,100%{transform:rotate(0deg) scale(1)}46%,62%{transform:rotate(2deg) scale(1.02,.98)}}
@keyframes nori-contented {0%,30%,74%,100%{transform:scaleY(1)}44%,62%{transform:scaleY(.14)}}
@keyframes nori-steam {0%{opacity:0;transform:translateY(3px)}25%{opacity:.6}100%{opacity:0;transform:translate(3px,-14px)}}
.cup-lift{transform-origin:184px 176px}

@keyframes nori-hop {0%,86%,100%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.09,.91)}30%{transform:translateY(-13px) scale(.94,1.06)}45%{transform:translateY(0) scale(1.07,.93)}60%{transform:translateY(-6px) scale(.965,1.035)}73%{transform:translateY(0) scale(1.035,.965)}}
@keyframes nori-hopGaze {0%,45%,86%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}60%{transform:translateY(-2px)}}
@keyframes nori-rock {0%,50%,100%{transform:translateY(0) rotate(0deg) scale(1,1)}25%{transform:translateY(-3px) rotate(-4deg) scale(1.055,.945)}75%{transform:translateY(-3px) rotate(4deg) scale(.965,1.035)}}
@keyframes nori-rockGaze {0%,50%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes nori-bob {0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.075,.925)}48%{transform:translateY(-11px) scale(.95,1.05)}76%{transform:translateY(0) scale(1.04,.96)}}
@keyframes nori-bobGaze {0%,100%{transform:translateY(0)}48%{transform:translateY(-3px)}}
@keyframes nori-inflate {0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.06,.94)}60%{transform:translateY(-4px) scale(.945,1.055)}}
@keyframes nori-pulse {0%,100%{transform:translateY(0) scale(1,1)}22%{transform:translateY(0) scale(1.085,.915)}48%{transform:translateY(-6px) scale(.945,1.055)}72%{transform:translateY(0) scale(1.04,.96)}}
@keyframes nori-dotBeat {0%,60%,100%{transform:translateY(0) scale(.8);opacity:.28}25%{transform:translateY(-5px) scale(1);opacity:1}}
@keyframes nori-dotChase {0%,65%,100%{transform:scale(.8);opacity:.25}28%{transform:scale(1.16);opacity:1}}
@keyframes nori-dotWave {0%,65%,100%{transform:translateY(0);opacity:.3}24%{transform:translateY(-4px);opacity:1}}
@keyframes nori-ripple {0%{transform:scale(.55,.75);opacity:0}18%{opacity:.65}100%{transform:scale(1.35,1.6);opacity:0}}
@keyframes nori-halo {0%,100%{transform:scale(.98,1);opacity:.25}60%{transform:scale(1.05,1.025);opacity:.9}}
.busy-dot,.ripple{transform-origin:0 0}
.busy-halo{transform-origin:128px 128px}
@keyframes nori-confetti0 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(-70px,-36px) rotate(-80deg)}100%{opacity:0;transform:translate(-100px,34px) rotate(-160deg)}}.confetti0{animation:nori-confetti0 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti1 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(-47.6px,-50px) rotate(60deg)}100%{opacity:0;transform:translate(-68px,14px) rotate(120deg)}}.confetti1{animation:nori-confetti1 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti2 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(-23.8px,-58px) rotate(-45deg)}100%{opacity:0;transform:translate(-34px,18px) rotate(-90deg)}}.confetti2{animation:nori-confetti2 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti3 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(1.4px,-62px) rotate(70deg)}100%{opacity:0;transform:translate(2px,8px) rotate(140deg)}}.confetti3{animation:nori-confetti3 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti4 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(25.2px,-58px) rotate(-65deg)}100%{opacity:0;transform:translate(36px,22px) rotate(-130deg)}}.confetti4{animation:nori-confetti4 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti5 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(49px,-50px) rotate(50deg)}100%{opacity:0;transform:translate(70px,16px) rotate(100deg)}}.confetti5{animation:nori-confetti5 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti6 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(71.4px,-36px) rotate(-75deg)}100%{opacity:0;transform:translate(102px,38px) rotate(-150deg)}}.confetti6{animation:nori-confetti6 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti7 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(-60.2px,-18px) rotate(40deg)}100%{opacity:0;transform:translate(-86px,72px) rotate(80deg)}}.confetti7{animation:nori-confetti7 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
@keyframes nori-confetti8 {0%{opacity:0;transform:translate(0,0) rotate(0deg)}8%,72%{opacity:1}45%{transform:translate(61.6px,-20px) rotate(-35deg)}100%{opacity:0;transform:translate(88px,68px) rotate(-70deg)}}.confetti8{animation:nori-confetti8 1.6s cubic-bezier(.2,.6,.4,1) 1 both}
.jelly{animation:nori-inflate 2.2s ease-in-out infinite}.gaze{animation:nori-bobGaze 2.2s ease-in-out infinite}.eyelid{animation:blink 5.4s ease-in-out infinite}.busy-halo{animation:nori-halo 2.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.steam,.orbit-prop{display:none}}</style>
<g class="orbit-prop"><g class="busy-halo" fill="none" stroke="#69C7DD" stroke-width="4" stroke-linecap="round"><path d="M33 69Q10 128 33 187"/><path d="M223 69Q246 128 223 187"/></g></g><g transform="translate(25 24) scale(0.78)"><g class="jelly"><path d="M 72 218 C 36 209 25 186 29 150 C 34 105 56 67 91 43 C 126 18 171 8 199 21 C 225 34 232 82 235 127 C 238 173 235 194 209 204 C 174 218 119 228 72 218 Z" fill="#BFEAF2"/><g class="gaze"><g transform="translate(119 113) rotate(-10)"><g class="eyelid"><rect x="-9" y="-17" width="18" height="34" rx="9" fill="#10283F"/></g></g><g transform="translate(182 106) rotate(-10)"><g class="eyelid"><rect x="-9" y="-17" width="18" height="34" rx="9" fill="#10283F"/></g></g></g></g></g>
</svg>
